services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      # Клиент и API на одном origin. Добавьте свой домен в прод.
      CLIENT_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000'
      # Обязателен: задайте свой секрет, например
      # JWT_SECRET="$(openssl rand -hex 32)" docker compose up --build
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. openssl rand -hex 32}
      COOKIE_SECURE: 'false'
      DATABASE_PATH: '/app/apps/server/data/ttt.db'
    volumes:
      - ttt-data:/app/apps/server/data
    restart: unless-stopped

volumes:
  ttt-data:
